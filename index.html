<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<title>حل مساله استخر و دو شیر آب</title>
<style>
:root{
  --smoke-0:#101216; --smoke-1:#1a1d22; --smoke-2:#292d35;
  --water:#58c8ff; --water-deep:#1b86c2;
  --ink:#16212c; --ink-soft:#4a5866; --paper:#ffffff;
  --mark:#d2392f; --note:#1763b8; --ok:#17825a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:#e9eef3;
  font-family:"Vazirmatn","Vazir","IRANSans",Tahoma,"Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 600px at 15% -10%, #3a3f49 0%, transparent 60%),
    radial-gradient(800px 600px at 100% 30%, #2b3038 0%, transparent 60%),
    linear-gradient(180deg,var(--smoke-1),var(--smoke-0));
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:18px 14px 28px}

h1{
  margin:6px 0 16px; text-align:center; font-weight:800;
  font-size:clamp(1.35rem,5.6vw,2.2rem); line-height:1.6;
  color:#f3f8fc; text-shadow:0 2px 18px rgba(88,200,255,.35);
}

.stage{
  position:relative; border-radius:18px; overflow:hidden; line-height:0;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  background:#222;
}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{
  margin:10px 4px 0; min-height:1.6em; text-align:center;
  font-size:.86rem; color:#b7c4cf; line-height:1.7;
}

.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 18px}
.bar button{
  font:inherit; font-weight:700; font-size:.98rem; color:#eaf6ff;
  padding:11px 18px; min-height:46px; border-radius:12px; cursor:pointer;
  border:1px solid rgba(88,200,255,.45);
  background:linear-gradient(180deg,rgba(88,200,255,.22),rgba(27,134,194,.18));
  transition:transform .12s, background .2s, border-color .2s;
}
.bar button:hover{background:linear-gradient(180deg,rgba(88,200,255,.34),rgba(27,134,194,.28))}
.bar button:active{transform:scale(.96)}
.bar button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.bar button.primary{background:linear-gradient(180deg,#58c8ff,#1b86c2);color:#04202f;border-color:#8fdcff}
.bar button.danger{border-color:rgba(255,130,120,.55);background:rgba(210,57,47,.2)}
.bar button.on{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.25)}

.board{
  background:var(--paper); color:var(--ink); border-radius:16px;
  padding:20px 18px 26px; min-height:210px;
  box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 0 0 1px #e4e9ee;
  font-size:1.04rem; line-height:2.05; overflow-wrap:anywhere;
}
.board .empty{color:#8794a1;text-align:center;margin:60px 0;font-size:.95rem}
.ln{animation:in .45s ease both;margin:4px 0}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ln.h{
  margin-top:20px; padding:2px 12px; font-weight:800; color:var(--mark);
  border-right:5px solid var(--mark); background:#fff3f1; border-radius:6px;
}
.ln.h:first-child{margin-top:0}
.ln.t.blue{color:var(--note)}
.ln.ok{color:var(--ok);font-weight:700}
.ln.warn{color:var(--mark);font-weight:700}
.ln.ans{
  margin-top:16px; padding:12px 14px; border-radius:12px; font-weight:800;
  background:#e8f7ef; border:2px solid var(--ok); color:#0d5b3e;
}
.eqline{display:flex;justify-content:center;direction:ltr;padding:6px 0;overflow-x:auto}
math{font-size:1.28em}
table.vt{margin:8px auto;border-collapse:collapse;direction:rtl;text-align:center;font-size:.9rem;line-height:1.6}
table.vt td{border:2px solid var(--ink);padding:6px 12px}
table.vt td.l{font-weight:700}
.trio{display:flex;flex-wrap:nowrap;gap:4px 6px;justify-content:center;align-items:flex-end;direction:ltr;padding:6px 0}
.trio .cell{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0}
.trio .cell small{
  direction:rtl;text-align:center;font-size:.7rem;line-height:1.55;color:var(--note);font-weight:600
}
.trio .op{padding-bottom:6px}
.star{color:var(--note);font-weight:800;padding-bottom:4px}
@media (max-width:480px){
  .board{padding:16px 12px 22px;font-size:1rem}
  .bar button{flex:1 1 44%;padding:10px 8px}
  .trio .cell small{font-size:.6rem}
  math{font-size:1.15em}
}
footer{
  text-align:center; margin-top:26px; font-size:.95rem; color:#c7d2db; letter-spacing:.2px;
}
@media (prefers-reduced-motion:reduce){ .ln{animation:none} }
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Floating drops in the background ---------- */
(function(){
  var c=$('bg'),g=c.getContext('2d'),W,H,d=[],dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
  function mk(init){
    var r=3+Math.random()*9;
    return {x:Math.random()*W,y:init?Math.random()*H:H+r*2,r:r,vy:.12+Math.random()*.35,
      ph:Math.random()*6.28,sw:.2+Math.random()*.5,a:.18+Math.random()*.3};
  }
  size();
  var N=reduce?10:Math.round(Math.min(34,Math.max(16,W/30)));
  for(var i=0;i<N;i++)d.push(mk(true));
  addEventListener('resize',size);
  function draw(){
    g.clearRect(0,0,W,H);
    for(var i=0;i<d.length;i++){
      var p=d[i];
      p.y-=p.vy;p.ph+=.012;
      var x=p.x+Math.sin(p.ph)*14*p.sw;
      if(p.y<-p.r*3){d[i]=mk(false);continue}
      var gr=g.createRadialGradient(x-p.r*.35,p.y-p.r*.4,p.r*.1,x,p.y,p.r);
      gr.addColorStop(0,'rgba(255,255,255,'+(p.a+.35)+')');
      gr.addColorStop(.45,'rgba(120,210,255,'+p.a+')');
      gr.addColorStop(1,'rgba(60,150,210,'+(p.a*.25)+')');
      g.beginPath();g.arc(x,p.y,p.r,0,6.283);g.fillStyle=gr;g.fill();
      g.beginPath();g.arc(x,p.y,p.r,0,6.283);
      g.strokeStyle='rgba(190,235,255,'+(p.a*.7)+')';g.lineWidth=.8;g.stroke();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- Taps: animated water + sound ---------- */
var waterOn=true, hint=$('hint');
var fx=$('fx'), fg=fx.getContext('2d'), img=$('pool'), FW=0, FH=0, fdpr=Math.min(window.devicePixelRatio||1,2);
/* nozzle tips and landing spots, as fractions of the picture */
var taps=[{x:.360,y:.604,ly:.745,lx:.358},{x:.659,y:.620,ly:.752,lx:.657}];
var drops=[], ripples=[];
function fsize(){
  var r=fx.getBoundingClientRect();
  FW=r.width;FH=r.height;fx.width=FW*fdpr;fx.height=FH*fdpr;fg.setTransform(fdpr,0,0,fdpr,0,0);
}
fsize();addEventListener('resize',fsize);
img.addEventListener('load',fsize);
function spawn(){
  taps.forEach(function(t,k){
    var n=reduce?1:3;
    for(var i=0;i<n;i++){
      drops.push({k:k,x:t.x*FW+(Math.random()-.5)*FW*.006,y:t.y*FH,vx:(Math.random()-.5)*.25,
        vy:1.2+Math.random()*1.2,r:FW*(.0016+Math.random()*.0022)});
    }
  });
}
var tick=0;
function fxLoop(){
  fg.clearRect(0,0,FW,FH);
  if(waterOn){ spawn(); tick++;
    taps.forEach(function(t,k){
      var x=t.x*FW,y0=t.y*FH,y1=t.ly*FH,w=FW*.011;
      var gr=fg.createLinearGradient(0,y0,0,y1);
      gr.addColorStop(0,'rgba(235,250,255,.85)');gr.addColorStop(1,'rgba(200,238,255,.25)');
      fg.fillStyle=gr;
      fg.beginPath();
      fg.moveTo(x-w/2,y0);
      fg.quadraticCurveTo(x-w/2+Math.sin(tick*.35+k)*1.2,(y0+y1)/2,x-w*.8,y1);
      fg.lineTo(x+w*.8,y1);
      fg.quadraticCurveTo(x+w/2+Math.sin(tick*.35+k)*1.2,(y0+y1)/2,x+w/2,y0);
      fg.closePath();fg.fill();
    });
    if(tick%7===0){taps.forEach(function(t){ripples.push({x:t.lx*FW,y:t.ly*FH,r:2,a:.7})})}
  }
  for(var i=drops.length-1;i>=0;i--){
    var p=drops[i],t=taps[p.k];
    p.vy+=.16;p.y+=p.vy;p.x+=p.vx;
    if(p.y>=t.ly*FH){drops.splice(i,1);if(waterOn)ripples.push({x:p.x,y:t.ly*FH,r:2,a:.55});continue}
    fg.beginPath();fg.arc(p.x,p.y,p.r,0,6.283);fg.fillStyle='rgba(225,247,255,.85)';fg.fill();
  }
  for(var j=ripples.length-1;j>=0;j--){
    var q=ripples[j];q.r+=FW*.0016;q.a-=.012;
    if(q.a<=0){ripples.splice(j,1);continue}
    fg.beginPath();fg.ellipse(q.x,q.y,q.r,q.r*.34,0,0,6.283);
    fg.strokeStyle='rgba(235,250,255,'+q.a+')';fg.lineWidth=1.4;fg.stroke();
  }
  requestAnimationFrame(fxLoop);
}
fxLoop();

var AC=window.AudioContext||window.webkitAudioContext, actx=null, wnode=null;
function startSound(){
  if(!AC)return;
  try{
    if(!actx)actx=new AC();
    if(actx.state==='suspended')actx.resume();
    if(wnode)return;
    var len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.06*w)/1.06;d[i]=(w*.6+last*5)*.5}
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;
    var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.5;
    var gain=actx.createGain();gain.gain.value=0;
    var lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=5.5;lg.gain.value=.05;
    lfo.connect(lg);lg.connect(gain.gain);
    src.connect(hp);hp.connect(bp);bp.connect(gain);gain.connect(actx.destination);
    src.start();lfo.start();
    gain.gain.linearRampToValueAtTime(.32,actx.currentTime+.6);
    wnode={src:src,lfo:lfo,gain:gain};
  }catch(e){}
}
function stopSound(){
  if(!wnode)return;
  var n=wnode;wnode=null;
  try{
    n.gain.gain.cancelScheduledValues(actx.currentTime);
    n.gain.gain.setValueAtTime(n.gain.gain.value,actx.currentTime);
    n.gain.gain.linearRampToValueAtTime(0,actx.currentTime+.35);
    setTimeout(function(){try{n.src.stop();n.lfo.stop()}catch(e){}},450);
  }catch(e){}
}
function soundRunning(){return !!(actx&&actx.state==='running'&&wnode)}
function startWater(){
  waterOn=true;startSound();
  setTimeout(function(){
    hint.textContent=soundRunning()?'آب همچنان از شیرها جاری است.':'آب جاری است؛ مرورگر تا اولین لمس یا حرکت شما صدا را آزاد نمی‌کند.';
  },250);
}
startWater();
/* Browsers block sound until the first touch: use any touch outside the buttons */
function firstTouch(e){
  if(waterOn&&!soundRunning()){startSound();setTimeout(function(){
    if(soundRunning())hint.textContent='آب همچنان از شیرها جاری است.';
  },250)}
}
['pointerdown','touchstart','mousedown','click','keydown','wheel','scroll'].forEach(function(ev){
  document.addEventListener(ev,firstTouch,{capture:true,passive:true});
});
/* try to start the sound by itself from the very beginning, and keep trying until the browser allows it */
var retry=setInterval(function(){
  if(soundRunning()){clearInterval(retry);hint.textContent='آب همچنان از شیرها جاری است.';return}
  startSound();
},700);
addEventListener('load',startSound);
/* Water never stops: it also resumes whenever the person returns to the page */
function resumeWater(){waterOn=true;if(!soundRunning())startSound()}
document.addEventListener('visibilitychange',function(){if(!document.hidden)resumeWater()});
addEventListener('pageshow',resumeWater);
addEventListener('focus',resumeWater);

/* ---------- Board player (1.5 s between lines) ---------- */
var board=$('board'),timers=[],last=null,STEP=1500;
function stopTimers(){timers.forEach(clearTimeout);timers=[]}
function add(it){
  var e=document.createElement('div');
  var k=it.k;
  e.className='ln '+(k==='h'?'h':k==='raw'?'':k==='ans'?'ans':k==='ok'?'ok':k==='warn'?'warn':'t'+(k.indexOf('blue')>-1?' blue':''));
  e.innerHTML=it.c;
  board.appendChild(e);
  var r=e.getBoundingClientRect();
  if(r.bottom>innerHeight-40||r.top<0){e.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}
}
function play(list){
  stopTimers();last=list;board.innerHTML='';
  list.forEach(function(it,i){timers.push(setTimeout(function(){add(it)},i*STEP))});
  board.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
function clearBoard(){
  stopTimers();
  board.innerHTML='<p class="empty">صفحه پاک شد. برای نمایش دوباره، یکی از دکمه‌ها را بزنید.</p>';
}

/* ---------- Buttons ---------- */

$('bState').addEventListener('click',function(){play(STATEMENT)});
$('bSolve').addEventListener('click',function(){play(SOLVE)});
$('bAgain').addEventListener('click',function(){
  if(last)play(last);
  else{board.innerHTML='<p class="empty">هنوز چیزی نمایش داده نشده است. «بیان مساله» یا «حل مساله» را بزنید.</p>'}
});
$('bClear').addEventListener('click',clearBoard);
bMusic.addEventListener('click',function(){
  if(music.paused){
    var p=music.play();
    if(p&&p.catch)p.catch(function(){
      bMusic.textContent='🎵 آهنگ بارگذاری نشد';bMusic.classList.remove('on');bMusic.setAttribute('aria-pressed','false');
    });
    bMusic.textContent='⏸ توقف آهنگ';bMusic.classList.add('on');bMusic.setAttribute('aria-pressed','true');
  }else{
    music.pause();
    bMusic.textContent='🎵 پخش آهنگ';bMusic.classList.remove('on');bMusic.setAttribute('aria-pressed','false');
  }
});
music.addEventListener('error',function(){
  bMusic.textContent='🎵 آهنگ بارگذاری نشد';bMusic.classList.remove('on');bMusic.setAttribute('aria-pressed','false');
});
})();
